name: Build TemuDriver3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX + CIA
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          which makerom || echo "makerom missing"
          make -j4
          ls -la TemuDriver3DS.* || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TemuDriver3DS
          path: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.smdh
            TemuDriver3DS.cia
            TemuDriver3DS.elf

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.${{ github.run_number }}
          name: TemuDriver3DS v3.3.${{ github.run_number }}
          files: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.cia
          fail_on_unmatched_files: false
          body: |
            TemuDriver3DS
            - .3dsx (HBMenu)
            - .cia (install with FBI)
            - 3D garage + first-person driving
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
