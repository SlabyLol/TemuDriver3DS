name: Build TemuDriver3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make -j4
          ls -la TemuDriver3DS.* || true

      - name: Build CIA with makerom
        run: |
          set -x
          if [ ! -f TemuDriver3DS.elf ]; then
            echo "No ELF - skip CIA"
            exit 0
          fi
          # Download makerom (not in default image)
          curl -sL -o /tmp/makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip"
          unzip -o /tmp/makerom.zip -d /tmp/makerom_bin
          MAKEROM=$(find /tmp/makerom_bin -type f -name makerom | head -1)
          chmod +x "$MAKEROM"
          "$MAKEROM" -help 2>&1 | head -5 || true
          arm-none-eabi-strip TemuDriver3DS.elf || true
          # Try with RSF + icon
          "$MAKEROM" -f cia -o TemuDriver3DS.cia -elf TemuDriver3DS.elf \
            -rsf meta/cia.rsf -icon TemuDriver3DS.smdh \
            -exefslogo -target t 2>&1 || \
          "$MAKEROM" -f cia -o TemuDriver3DS.cia -elf TemuDriver3DS.elf \
            -rsf meta/cia.rsf -target t 2>&1 || \
          "$MAKEROM" -f cia -o TemuDriver3DS.cia -elf TemuDriver3DS.elf -target t 2>&1 || true
          ls -la TemuDriver3DS.cia || echo "CIA still missing"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TemuDriver3DS
          path: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.smdh
            TemuDriver3DS.cia
            TemuDriver3DS.elf
          if-no-files-found: warn

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.${{ github.run_number }}
          name: TemuDriver3DS v3.4.${{ github.run_number }}
          files: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.cia
          fail_on_unmatched_files: false
          body: |
            - TemuDriver3DS.3dsx (HBMenu)
            - TemuDriver3DS.cia (FBI install)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
