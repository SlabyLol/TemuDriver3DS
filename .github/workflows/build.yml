name: Build TemuDriver3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$PATH
          mkdir -p romfs/gfx romfs/sfx
          if command -v tex3ds >/dev/null; then
            tex3ds -i gfx/sprites.t3s -o romfs/gfx/sprites.t3x || true
          fi
          make -j$(nproc)
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TemuDriver3DS
          path: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.smdh
            TemuDriver3DS.elf

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: TemuDriver3DS v1.3.${{ github.run_number }}
          files: TemuDriver3DS.3dsx
          body: |
            Pure citro2d Temu Driver
            - Top screen: driving
            - Bottom: steering wheel + pedal + bars
            - A/R = Pedal (boost)
            - Y/B/L = Drift
            - Circle Pad = Steer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
