name: Build TemuDriver3DS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    steps:
    - uses: actions/checkout@v4

    - name: Ensure resources and romfs
      run: |
        mkdir -p resources romfs/cars romfs/city romfs/gfx romfs/sfx
        apt-get update -qq && apt-get install -y -qq imagemagick 2>/dev/null || true
        if [ ! -f resources/banner.png ]; then
          convert -size 256x128 xc:'#c1121f' -fill white -gravity center -pointsize 24 -annotate 0 'TEMU DRIVER' resources/banner.png || true
        fi
        if [ ! -f resources/icon.png ]; then
          if [ -f logo.png ]; then cp logo.png resources/icon.png
          else convert -size 48x48 xc:'#c1121f' resources/icon.png || true
          fi
        fi
        if [ ! -f resources/banner.wav ]; then
          python3 -c "import wave; w=wave.open('resources/banner.wav','w'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b'\\x00'*(44100*2*2)); w.close()"
        fi
        cp -f assets/cars/*.obj romfs/cars/ 2>/dev/null || true
        cp -f assets/cars/*.png romfs/cars/ 2>/dev/null || true
        cp -f assets/city/*.obj romfs/city/ 2>/dev/null || true
        ls -la romfs/cars romfs/city || true

    - name: Build BannerTool
      run: |
        git clone https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool && cmake -B build && cmake --build build && cmake --install build

    - name: Build Makerom
      run: |
        git clone --recursive https://github.com/3DSGuy/Project_CTR
        cd Project_CTR/makerom && make deps && make
        cp ./bin/makerom /usr/local/bin/makerom && chmod +x /usr/local/bin/makerom

    - name: Build 3DSX and CIA
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=/opt/devkitpro/devkitARM
        export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:/usr/local/bin:$PATH
        mkdir -p romfs/cars romfs/city
        cp -f assets/cars/*.obj romfs/cars/ 2>/dev/null || true
        cp -f assets/city/*.obj romfs/city/ 2>/dev/null || true
        make 3dsx
        make cia
        ls -la *.3dsx *.cia *.elf 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TemuDriver3DS-v1
        path: |
          ./*.cia
          ./*.3dsx

    - name: Release v1.0.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "TemuDriver3DS v1.0.0"
        body: "First official release — real 3D models in garage and drive. Hold A to accelerate."
        files: |
          ./*.cia
          ./*.3dsx
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
