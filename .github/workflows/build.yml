name: Build TemuDriver3DS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX + CIA
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          mkdir -p romfs/gfx romfs/sfx romfs/cars meta
          if [ -d assets/cars ]; then
            cp assets/cars/*.obj romfs/cars/ 2>/dev/null || true
            cp assets/cars/*.mtl romfs/cars/ 2>/dev/null || true
            cp assets/cars/*.png romfs/cars/ 2>/dev/null || true
          fi
          make -j4
          ls -la
          if command -v makerom >/dev/null 2>&1 && [ -f TemuDriver3DS.elf ]; then
            arm-none-eabi-strip TemuDriver3DS.elf 2>/dev/null || true
            makerom -f cia -o TemuDriver3DS.cia -elf TemuDriver3DS.elf \
              -rsf meta/cia.rsf -icon TemuDriver3DS.smdh \
              -exefslogo -target t 2>/dev/null || \
            makerom -f cia -o TemuDriver3DS.cia -elf TemuDriver3DS.elf -target t 2>/dev/null || true
            ls -la *.cia 2>/dev/null || echo "CIA optional"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TemuDriver3DS
          path: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.smdh
            TemuDriver3DS.cia
            TemuDriver3DS.elf

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.${{ github.run_number }}
          name: TemuDriver3DS v3.2.${{ github.run_number }}
          files: |
            TemuDriver3DS.3dsx
            TemuDriver3DS.cia
          body: |
            Build fixed
            - 3DSX + CIA
            - 3D garage cars (van, coupe, ...)
            - 3D banner CGFX can be added later via bannertool locally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
