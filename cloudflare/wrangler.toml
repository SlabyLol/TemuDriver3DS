name = "temu-driver-chat"
main = "worker.js"
compatibility_date = "2024-11-01"

# Create KV namespaces then put the IDs here:
#   wrangler kv namespace create USERS
#   wrangler kv namespace create MESSAGES
#   wrangler kv namespace create USERS --preview
#   wrangler kv namespace create MESSAGES --preview

[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_USERS_KV_ID"
preview_id = "REPLACE_USERS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "MESSAGES"
id = "REPLACE_MESSAGES_KV_ID"
preview_id = "REPLACE_MESSAGES_KV_PREVIEW_ID"
